{% extends "base.html" %}
{% block content %}

<!-- Login Page -->
<section class="flex items-center justify-center min-h-screen bg-gradient-to-r from-pink-100 via-pink-200 to-pink-300">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
    
    <!-- Title -->
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome Back 👋</h2>
    <p class="text-center text-gray-600 mb-8">Login to continue your creative journey</p>

    <!-- Login Form -->
    <form method="POST" action="/login">
      
      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
        <input type="email" id="email" name="email" required
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none">
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" id="password" name="password" required
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none">
      </div>

      <!-- Remember Me + Forgot -->
      <div class="flex items-center justify-between mb-6">
        <label class="flex items-center text-sm text-gray-600">
          <input type="checkbox" class="mr-2 rounded border-gray-300"> Remember me
        </label>
        <a href="/forgot-password" class="text-sm text-pink-500 hover:underline">Forgot Password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" 
              class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg transition">
        Login
      </button>
    </form>

    <!-- Divider -->
    <div class="my-6 text-center text-gray-400">or continue with</div>

    <!-- Social Login -->
    <div class="flex justify-center gap-4">
      <button class="px-4 py-2 border rounded-lg hover:bg-gray-100 flex items-center">
        <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" class="w-5 h-5 mr-2"> Google
      </button>
      <button class="px-4 py-2 border rounded-lg hover:bg-gray-100 flex items-center">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" class="w-5 h-5 mr-2"> Facebook
      </button>
    </div>

    <!-- Signup Link -->
    <p class="text-center text-gray-600 mt-6 text-sm">
  New user? 
  <a href="{{ url_for('signup') }}" 
     class="text-pink-500 font-semibold hover:text-pink-600 transition">
    Create an account
  </a>
</p>

  </div>
</section>

{% endblock %}
